<div class="min-h-screen bg-gray-100 flex">
  <div class="flex-1 p-3">

    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      <div>
        <img src="https://images.unsplash.com/photo-1520880867055-1e30d1cb001c" 
             class="h-80 w-full object-cover"> 
      </div>

      <div class="p-6">
        <div class="flex items-center gap-4">
          <img src="https://i.pravatar.cc/120" 
               class="w-24 h-24 rounded-full border-4 border-white shadow -mt-14">

          <div>
            <h2 class="text-2xl font-semibold text-gray-800">{{ leadForm.fullname }}</h2>
            <p class="text-gray-500">{{ leadForm.email }}</p>
          </div>
          
          <button class="flex items-center gap-1 px-3 py-1.5 bg-black text-white rounded-lg hover:bg-slate-800 shadow cursor-pointer text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
            </svg>
            <span>Update</span>
          </button>
        </div>

        <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6">

          <div class="flex justify-between border-b pb-2">
            <span class="text-gray-600">Phone</span>
            <span class="font-medium">{{ leadForm.phone }}</span>
          </div>

          <div class="flex justify-between border-b pb-2">
            <span class="text-gray-600">Salary</span>
            <span class="font-medium">{{ leadForm.salary }}</span>
          </div>

          <div class="flex justify-between border-b pb-2">
            <span class="text-gray-600">Resource</span>
            <span class="font-medium">{{ leadForm.resource }}</span>
          </div>

          <div class="flex justify-between border-b pb-2">
            <span class="text-gray-600">Created At</span>
            <span class="font-medium">{{ leadForm.createdAt }}</span>
          </div>

          <div class="flex justify-between border-b pb-2 col-span-2">
            <span class="text-gray-600">Location</span>
            <span class="font-medium">{{ leadForm.location }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
