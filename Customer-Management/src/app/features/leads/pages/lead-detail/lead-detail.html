<div class="bg-gray-100 flex justify-center items-start py-12">
  <div class="w-full max-w-2xl">

    <div class="bg-white rounded-3xl shadow-lg overflow-visible">

      <div>
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=80" 
             class="h-40 w-full object-cover"> 
      </div>

      <div class="p-6">
        <div class="flex items-center gap-4">
          <img src="https://i.pravatar.cc/120" 
              class="w-24 h-24 rounded-full border-4 border-white shadow -mt-14">

          <div>
            <h2
              class="text-2xl font-semibold text-gray-800"
              [attr.contenteditable]="isEditing"
              [style.outline]="'none'"
              [style.whiteSpace]="'nowrap'"
            >
              <span *ngIf="!isEditing">{{ leadForm.fullname }}</span>
              <input
                *ngIf="isEditing"
                [(ngModel)]="leadForm.fullname"
                class="text-2xl font-semibold text-gray-800 focus:outline-none inline-block w-auto bg-transparent"
              >
            </h2>

            <p
              class="text-gray-500"
              [attr.contenteditable]="isEditing ? 'true' : 'false'"
              [style.outline]="'none'"
            >
              <span *ngIf="!isEditing" class="font-medium">{{ leadForm.email }}</span>
              <input
                *ngIf="isEditing"
                [(ngModel)]="leadForm.email"
                class="text-gray-500 focus:outline-none inline-block w-auto bg-transparent"
              >
            </p>
          </div>

          <div class="ml-auto min-w-[110px] flex justify-end">
            <button        
              *ngIf="isSaveEdit" 
              class="flex items-center gap-1 px-3 py-1.5 bg-black text-white rounded-lg hover:bg-slate-800 shadow cursor-pointer text-sm"
              (click)="onEdit()">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6"> 
                <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" /> 
              </svg>
              <span>Edit</span>
            </button>

            <button        
              *ngIf="isEditing" 
              class="flex items-center gap-1 px-3 py-1.5 bg-green-600 text-white rounded-lg hover:bg-green-700 shadow cursor-pointer text-sm"
              (click)="onUpdateLead()">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6"> 
                <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" /> 
              </svg>
              <span>Save</span>
            </button>
          </div>  
        </div>

        <div class="mt-10 grid grid-cols-1 md:grid-cols-2 gap-12">

          <div class="flex justify-between items-center border-b pb-2">
            <span class="text-gray-600">Phone</span>
            <span *ngIf="!isEditing" class="font-medium text-right w-1/2">
              {{ leadForm.phone }}
            </span>
            <input
              *ngIf="isEditing"
              type="number"
              [(ngModel)]="leadForm.phone"
              class="font-medium text-right w-1/2 focus:outline-none"
            >
          </div>

          <div class="flex justify-between border-b pb-2">
            <span class="text-gray-600">Salary</span>
            <span *ngIf="!isEditing" class="font-medium">{{ leadForm.salary }}</span>
            <input
              *ngIf="isEditing"
              type="number"
              [(ngModel)]="leadForm.salary"
              class="font-medium text-right w-1/2 focus:outline-none"
            >
          </div>

          <div class="flex justify-between border-b pb-2">
            <span class="text-gray-600">Resource</span>
            <span *ngIf="!isEditing" class="font-medium">{{ leadForm.resource }}</span>
            <input
              *ngIf="isEditing"
              [(ngModel)]="leadForm.resource"
              class="font-medium text-right w-1/2 focus:outline-none"
            >
          </div>

          <div class="flex justify-between border-b pb-2">
            <span class="text-gray-600">Created At</span>
            <span class="font-medium">{{ leadForm.createdAt | customDate }}</span>
          </div>

          <div class="flex justify-between border-b pb-2 col-span-2">
            <span class="text-gray-600">Location</span>
            <span *ngIf="!isEditing" class="font-medium">{{ leadForm.location }}</span>
            <input
              *ngIf="isEditing"
              [(ngModel)]="leadForm.location"
              class="font-medium text-right w-1/2 focus:outline-none"
            >
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
