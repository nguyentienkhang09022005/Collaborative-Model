<div class="min-h-screen bg-gradient-to-br from-slate-100 via-slate-50 to-white flex items-center justify-center p-6">
  <app-toast></app-toast>
  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-10">
      <div class="inline-block mb-4">
        <app-logo [size]="64" [stacked]="true"
          textClass="text-3xl text-violet-600 mt-3"
          [showText]="true"></app-logo>
      </div>
      <p class="text-slate-500 mt-2">Collaborative CRM Platform</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-10">
      <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-slate-900">Welcome Back</h2>
        <p class="text-slate-500 mt-2">Sign in to continue to your dashboard</p>
      </div>

      <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm)" class="space-y-5">
        <!-- Username -->
        <div class="space-y-2">
          <label for="username" class="text-sm font-semibold text-slate-700">Username</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
              </svg>
            </div>
            <input id="username" name="username" type="text" placeholder="Enter your username"
              [(ngModel)]="loginData.username" required #username="ngModel"
              class="w-full pl-12 pr-4 py-3 border border-slate-200 rounded-xl bg-slate-50
                     focus:bg-white focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20
                     transition-all placeholder:text-slate-400 text-slate-900" />
          </div>
          <p *ngIf="username.invalid && username.touched" class="text-red-500 text-xs flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            Username is required
          </p>
        </div>

        <!-- Password -->
        <div class="space-y-2">
          <label for="password" class="text-sm font-semibold text-slate-700">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16.5 10.5V7a4.5 4.5 0 10-9 0v3.5m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
              </svg>
            </div>
            <input id="password" name="password" [type]="showPassword ? 'text' : 'password'" placeholder="Enter your password"
              [(ngModel)]="loginData.password" required #password="ngModel"
              class="w-full pl-12 pr-12 py-3 border border-slate-200 rounded-xl bg-slate-50
                     focus:bg-white focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20
                     transition-all placeholder:text-slate-400 text-slate-900" />
            <button type="button" (click)="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center">
              <svg *ngIf="!showPassword" class="w-5 h-5 text-slate-400 hover:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              <svg *ngIf="showPassword" class="w-5 h-5 text-slate-400 hover:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
              </svg>
            </button>
          </div>
          <p *ngIf="password.invalid && password.touched" class="text-red-500 text-xs flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            Password is required
          </p>
        </div>

        <!-- Forgot Password -->
        <div class="flex justify-end pt-2">
          <a href="/forgot-password" class="text-sm font-medium text-sky-600 hover:text-sky-700 hover:underline transition-colors">
            Forgot Password?
          </a>
        </div>

        <!-- Submit -->
        <button type="submit" [disabled]="isLoading"
          class="w-full py-3.5 bg-gradient-to-r from-sky-600 to-sky-700 text-white rounded-xl
                 font-semibold shadow-lg hover:shadow-xl hover:from-sky-700 hover:to-sky-800
                 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 mt-6">
          <span>Sign In</span>
          <svg *ngIf="isLoading" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>
