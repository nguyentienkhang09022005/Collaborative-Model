<div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
  <div class="flex flex-col lg:flex-row bg-white rounded-3xl shadow-2xl overflow-hidden w-full max-w-4xl">

    <!-- Cột Marketing -->
    <div
      class="flex flex-col justify-between bg-[#121A29] text-white p-8 lg:p-12 flex-1 relative bg-cover bg-center">
      <div>
        <!-- Logo -->
        <div class="flex flex-col gap-3 mb-6">
          <div class="flex items-center gap-2 text-2xl font-bold">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6">
              <rect x="2" y="5" width="20" height="14" rx="3" stroke="currentColor" stroke-width="2"/>
              <path d="M10 9L15 12L10 15V9Z" fill="currentColor"/>
            </svg>
            Customer-Management
          </div>
        </div>

        <!-- Tiêu đề marketing -->
        <h1 class="text-2xl lg:text-3xl font-extrabold leading-snug lg:mb-32">
          Reset Your Password.<br />Stay Safe.
        </h1>
      </div>
    </div>

    <!-- Cột Form -->
    <div class="flex flex-col items-center justify-center p-6 lg:p-12 flex-1">
      <div class="w-full max-w-sm">
        <h2 class="text-2xl lg:text-3xl font-extrabold mb-2">New Password</h2>
        <p class="text-gray-500 text-sm mb-6">Enter your new password below.</p>

        <form #resetForm="ngForm" (ngSubmit)="onResetPassword(resetForm)" class="flex flex-col gap-3">

          <!-- New Password -->
          <div>
            <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
            <input id="newPassword" name="newPassword" type="password" placeholder="Enter new password"
              [(ngModel)]="confirmOTPForgotPasswordData.newPassword" required minlength="6"
              #newPassword="ngModel"
              class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-black focus:border-black placeholder:text-slate-500" />
            <div class="h-4 text-red-500 text-xs mt-1">
              <span *ngIf="newPassword.invalid && newPassword.touched">
                <span *ngIf="newPassword.errors?.['required']">New password is required</span>
                <span *ngIf="newPassword.errors?.['minlength']">Password must be at least 6 characters</span>
              </span>
            </div>
          </div>

          <!-- Confirm Password -->
          <div>
            <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm new password"
              [(ngModel)]="confirmOTPForgotPasswordData.confirmPassword" required
              #confirmPassword="ngModel"
              class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-black focus:border-black placeholder:text-slate-500" />
            <div class="h-4 text-red-500 text-xs mt-1">
              <span *ngIf="confirmPassword.invalid && confirmPassword.touched">
                <span *ngIf="confirmPassword.errors?.['required']">Confirm password is required</span>
              </span>
            </div>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="relative bg-black text-white py-2.5 rounded-lg font-semibold w-full flex justify-center items-center hover:bg-gray-800 transition disabled:opacity-80 cursor-pointer"
            [disabled]="isLoading">

            <!-- Loading Spinner -->
            <svg *ngIf="isLoading" class="absolute animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>

            <span [class.invisible]="isLoading">Reset Password</span>
          </button>
        </form>

        <p class="text-center mt-6 text-sm text-gray-500">
          Remembered your password?
          <a href="/authen" class="text-black font-semibold hover:underline">Login here</a>
        </p>
      </div>
    </div>
  </div>
</div>
