<div class="min-h-screen bg-gradient-to-br from-slate-100 to-slate-200 flex items-center justify-center p-6">
  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-900 rounded-2xl mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-slate-900 tracking-wide">SIDEBOARD</h1>
      <p class="text-slate-500 mt-2">Collaborative CRM Platform</p>
    </div>

    <!-- Register Card -->
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-10">
      <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-slate-900">Create Account</h2>
        <p class="text-slate-500 mt-2">Sign up to get started</p>
      </div>

      <form #registerForm="ngForm" (ngSubmit)="onRegister(registerForm)" class="space-y-5">
        <!-- Full Name -->
        <div class="space-y-2">
          <label for="fullName" class="text-sm font-semibold text-slate-700">Full Name</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
              </svg>
            </div>
            <input id="fullName" name="fullName" type="text" placeholder="Enter full name"
              [(ngModel)]="registerData.fullName" required #fullname="ngModel"
              class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl
                     focus:bg-white focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20
                     transition-all placeholder:text-slate-400" />
          </div>
          <p *ngIf="fullname.invalid && fullname.touched" class="text-red-500 text-xs flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            Full name is required
          </p>
        </div>

        <!-- Email -->
        <div class="space-y-2">
          <label for="email" class="text-sm font-semibold text-slate-700">Email</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/>
              </svg>
            </div>
            <input id="email" name="email" type="email" placeholder="Enter email address"
              [(ngModel)]="registerData.email" required email #email="ngModel"
              class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl
                     focus:bg-white focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20
                     transition-all placeholder:text-slate-400" />
          </div>
          <p *ngIf="email.invalid && email.touched" class="text-red-500 text-xs flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <span *ngIf="email.errors?.['required']">Email is required</span>
            <span *ngIf="email.errors?.['email']">Invalid email format</span>
          </p>
        </div>

        <!-- Username -->
        <div class="space-y-2">
          <label for="userName" class="text-sm font-semibold text-slate-700">Username</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.982 18.725A6.493 6.493 0 0012 15.75c-3.307 0-6.22-2.25-7.003-5.465L3.707 6.54l-.004-.007A6.502 6.502 0 003 12c0 3.59 2.91 6.5 6.5 6.5h1.09a4.5 4.5 0 003.401-7.425"/>
              </svg>
            </div>
            <input id="userName" name="userName" type="text" placeholder="Choose a username"
              [(ngModel)]="registerData.userName" required #userName="ngModel"
              class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl
                     focus:bg-white focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20
                     transition-all placeholder:text-slate-400" />
          </div>
          <p *ngIf="userName.invalid && userName.touched" class="text-red-500 text-xs flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            Username is required
          </p>
        </div>

        <!-- Password -->
        <div class="space-y-2">
          <label for="password" class="text-sm font-semibold text-slate-700">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16.5 10.5V7a4.5 4.5 0 10-9 0v3.5m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
              </svg>
            </div>
            <input id="password" name="password" type="password" placeholder="Create a strong password"
              [(ngModel)]="registerData.password" required #password="ngModel"
              class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl
                     focus:bg-white focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20
                     transition-all placeholder:text-slate-400" />
          </div>
          <p *ngIf="password.invalid && password.touched" class="text-red-500 text-xs flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            Password is required
          </p>
        </div>

        <!-- Confirm Password -->
        <div class="space-y-2">
          <label for="confirmPassword" class="text-sm font-semibold text-slate-700">Confirm Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
              </svg>
            </div>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm your password"
              [(ngModel)]="registerData.confirmPassword" required #confirmPassword="ngModel"
              class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl
                     focus:bg-white focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20
                     transition-all placeholder:text-slate-400" />
          </div>
          <p *ngIf="confirmPassword.invalid && confirmPassword.touched" class="text-red-500 text-xs flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            Please confirm your password
          </p>
        </div>

        <!-- Submit -->
        <button type="submit" [disabled]="isLoading"
          class="w-full py-3.5 bg-gradient-to-r from-slate-800 to-slate-900 text-white rounded-xl
                 font-semibold shadow-lg hover:shadow-xl hover:from-slate-900 hover:to-slate-800
                 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 mt-6">
          <span>Create Account</span>
          <svg *ngIf="isLoading" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </button>
      </form>

      <!-- Sign In Link -->
      <div class="mt-8 pt-6 border-t border-slate-100 text-center">
        <p class="text-slate-500 text-sm">
          Already have an account?
          <a href="/authen" class="font-semibold text-sky-600 hover:text-sky-700 transition-colors"> Sign in</a>
        </p>
      </div>
    </div>
  </div>
</div>
