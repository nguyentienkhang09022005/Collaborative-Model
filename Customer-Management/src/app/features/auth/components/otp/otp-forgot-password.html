<div class="min-h-screen bg-gradient-to-br from-slate-100 via-slate-50 to-white flex items-center justify-center p-6">
  <app-toast></app-toast>
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-900 rounded-2xl mb-4 shadow-lg">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold bg-gradient-to-r from-sky-600 to-emerald-500 bg-clip-text text-transparent tracking-wide">SIDEBOARD</h1>
    </div>

    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-sky-100 rounded-xl flex items-center justify-center mx-auto mb-3">
          <svg class="w-6 h-6 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
          </svg>
        </div>
        <h2 class="text-xl font-bold text-slate-900">Reset Password</h2>
        <p class="text-sm text-slate-500 mt-1">Enter 6-digit code sent to your email</p>
      </div>

      <form #otpForm="ngForm" (ngSubmit)="onConfirmForgotPasswordOTP(otpForm)" class="space-y-4">
        <div class="flex gap-2 justify-center">
          <input *ngFor="let i of [0,1,2,3,4,5]" type="text" maxlength="1"
            class="w-12 h-14 text-center text-xl font-bold border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:border-slate-900 focus:ring-2 focus:ring-slate-900/20 transition-all placeholder:text-slate-400 text-slate-900"
            [(ngModel)]="otpDigits[i]" [name]="'otp' + i" required
            (input)="onOtpInput($event, i)"
            (keydown)="onOtpKeydown($event, i)">
        </div>

        <button type="submit" [disabled]="isLoading"
          class="w-full py-3 bg-gradient-to-r from-sky-600 to-sky-700 text-white rounded-xl font-semibold
                 shadow-lg hover:shadow-xl hover:from-sky-700 hover:to-sky-800
                 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          Verify OTP
        </button>
      </form>

      <p class="text-center text-sm text-slate-500 mt-6">
        Remember your password?
        <a href="/authen" class="font-medium text-sky-600 hover:text-sky-700 hover:underline">Sign in</a>
      </p>
    </div>
  </div>
</div>
