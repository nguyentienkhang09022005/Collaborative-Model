<div class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-900 tracking-wide">SIDEBOARD</h1>
    </div>

    <div class="bg-white border border-slate-200 p-8">
      <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-slate-900">OTP Verification</h2>
        <p class="text-sm text-slate-500 mt-1">Enter 6-digit code sent to your email</p>
      </div>

      <form #otpForm="ngForm" (ngSubmit)="onConfirmRegisterOTP(otpForm)" class="space-y-4">
        <div>
          <label for="otp" class="block text-sm font-medium text-slate-700 mb-1">OTP Code</label>
          <input id="otp" name="otp" type="text" maxlength="6" placeholder="Enter 6 digits"
            [(ngModel)]="confirmOTPData.otp" required #otp="ngModel"
            class="w-full px-3 py-2.5 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 text-sm text-center text-xl tracking-widest" />
          <p *ngIf="otp.invalid && otp.touched" class="text-red-500 text-xs mt-1">OTP is required (6 digits)</p>
        </div>

        <button type="submit" [disabled]="isLoading"
          class="w-full py-2.5 bg-slate-900 text-white hover:bg-slate-800 text-sm font-medium disabled:opacity-50">
          Verify OTP
        </button>
      </form>

      <p class="text-center text-sm text-slate-500 mt-6">
        Already verified?
        <a href="/authen" class="text-sky-500 hover:text-sky-600 font-medium">Sign in</a>
      </p>
    </div>
  </div>
</div>
