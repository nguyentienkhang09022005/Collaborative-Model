<div [class]="themeConfig().contentBg + ' min-h-screen p-6'">
  <div class="max-w-3xl mx-auto">
    <!-- Header -->
    <div class="flex items-center gap-4 mb-8">
      <div [class]="'w-12 h-12 rounded-xl flex items-center justify-center shadow-lg ' + (themeConfig().id === 'dark' ? 'bg-slate-700' : 'bg-gradient-to-br from-sky-500 to-emerald-500')">
        <svg [class]="'w-6 h-6 ' + (themeConfig().id === 'dark' ? 'text-slate-300' : 'text-white')" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-2xl font-bold" [class]="themeConfig().textPrimary">Settings</h1>
        <p [class]="'text-sm mt-0.5 ' + themeConfig().textSecondary">Customize your application preferences</p>
      </div>
    </div>

    <!-- Theme Section -->
    <div [class]="themeConfig().cardBg + ' rounded-2xl shadow-md border ' + themeConfig().borderColor + ' overflow-hidden mb-6'">
      <div [class]="'px-6 py-4 border-b ' + themeConfig().borderColor + ' ' + (themeConfig().id === 'dark' ? 'bg-slate-800' : 'bg-gradient-to-r from-slate-50 to-white')">
        <h2 [class]="'text-lg font-semibold flex items-center gap-2 ' + themeConfig().textPrimary">
          <svg [class]="'w-5 h-5 ' + (themeConfig().id === 'dark' ? 'text-sky-400' : 'text-sky-500')" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/>
          </svg>
          Theme
        </h2>
        <p [class]="'text-sm mt-1 ' + themeConfig().textSecondary">Choose your preferred color theme</p>
      </div>

      <div class="p-6">
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
          @for (theme of themes; track theme.id) {
            <button
              (click)="selectTheme(theme.id)"
              class="relative p-4 rounded-xl border-2 transition-all duration-300 group hover:-translate-y-1"
              [class.border-slate-600]="isSelected(theme.id) && themeConfig().id === 'dark'"
              [class.border-sky-500]="isSelected(theme.id) && themeConfig().id !== 'dark'"
              [class.border-slate-700]="!isSelected(theme.id) && themeConfig().id === 'dark'"
              [class.border-slate-200]="!isSelected(theme.id) && themeConfig().id !== 'dark'"
              [class.bg-slate-700]="!isSelected(theme.id) && themeConfig().id === 'dark'"
              [class.bg-slate-50]="!isSelected(theme.id) && themeConfig().id !== 'dark'"
              [class.bg-sky-900]="isSelected(theme.id) && themeConfig().id === 'dark'"
              [class.bg-sky-50]="isSelected(theme.id) && themeConfig().id !== 'dark'"
              [class.hover:shadow-lg]="true">

              <!-- Theme Preview -->
              <div class="rounded-lg overflow-hidden mb-3 h-16 shadow-sm transition-transform group-hover:scale-105"
                   [class]="theme.cardBg">
                <div class="h-5" [class]="theme.sidebarBg"></div>
                <div class="p-2">
                  <div class="h-2 rounded mb-1" [class]="theme.textSecondary"></div>
                  <div class="h-2 rounded w-2/3" [class]="theme.textPrimary"></div>
                </div>
              </div>

              <!-- Theme Info -->
              <div class="flex items-center justify-between">
                <span class="text-2xl">{{ theme.icon }}</span>
                <span class="font-semibold" [class]="theme.textPrimary">{{ theme.name }}</span>
              </div>

              <!-- Selected Badge -->
              @if (isSelected(theme.id)) {
                <div class="absolute -top-3 -right-3 w-7 h-7 bg-sky-500 rounded-full flex items-center justify-center shadow-lg">
                  <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                  </svg>
                </div>
              }
            </button>
          }
        </div>
      </div>
    </div>

  </div>
</div>
