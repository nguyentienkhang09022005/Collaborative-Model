<div class="min-h-screen bg-slate-100 p-4">
  
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Customers</h1>

    <div class="flex items-center gap-3">
      <input
        type="text"
        placeholder="Search…"
        class="px-4 py-2 bg-white rounded-xl shadow border border-slate-200 w-64 placeholder-gray-500"
        [(ngModel)]="searchInput.keyword"
        (keyup.enter)="SearchCustomer()"
      />

      <button 
        class="flex items-center gap-1 px-3 py-1.5 bg-green-500 text-white rounded-lg hover:bg-green-600 shadow cursor-pointer text-sm"
        (click)="openUploadPopup()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 21 24" width="21" height="21" color="#ffffff" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.25 21H18.75C18.9822 21 19.0983 21 19.196 20.9904C20.1456 20.8968 20.8968 20.1456 20.9904 19.196C21 19.0983 21 18.9822 21 18.75C21 18.5178 21 18.4017 20.9904 18.304C20.8968 17.3544 20.1456 16.6032 19.196 16.5096C19.0983 16.5 18.9822 16.5 18.75 16.5H17.0607C16.8324 16.5 16.7182 16.5 16.6087 16.5121C16.2317 16.5538 15.8742 16.7018 15.5781 16.939C15.4921 17.0079 15.4114 17.0886 15.25 17.25C15.0886 17.4114 15.0079 17.4921 14.9219 17.561C14.6258 17.7982 14.2683 17.9462 13.8913 17.9879C13.7818 18 13.6676 18 13.4393 18H10.5607C10.3324 18 10.2182 18 10.1087 17.9879C9.73165 17.9462 9.37423 17.7982 9.07814 17.561C8.99213 17.4921 8.91142 17.4114 8.75 17.25C8.58858 17.0886 8.50787 17.0079 8.42186 16.939C8.12577 16.7018 7.76835 16.5538 7.3913 16.5121C7.28177 16.5 7.16763 16.5 6.93934 16.5H5.25C5.01783 16.5 4.90175 16.5 4.80397 16.5096C3.85441 16.6032 3.10315 17.3544 3.00963 18.304C3 18.4017 3 18.5178 3 18.75C3 18.9822 3 19.0983 3.00963 19.196C3.10315 20.1456 3.85441 20.8968 4.80397 20.9904C4.90175 21 5.01783 21 5.25 21Z" />
          <path d="M16.5 7.49996C16.5 7.49996 13.1858 3.00001 12 3C10.8141 2.99999 7.5 7.5 7.5 7.5M12 4V15" />
        </svg>
        <span>Upload File</span>
      </button>
      
      <button 
        class="flex items-center gap-1 px-3 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow cursor-pointer text-sm"
        (click)="openAddPopup()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        <span>Add Customer</span>
      </button>
    </div>
  </div>

  <div class="bg-white shadow-lg rounded-2xl p-6 overflow-visible">

    <table class="w-full border-collapse">
      <thead>
        <tr class="text-left text-sm text-slate-500 border-b">
          <th class="py-3">Full Name</th>
          <th class="py-3">Email</th>
          <th class="py-3">Phone</th>
          <th class="py-3">Salary</th>
          <th class="py-3">Location</th>
          <th class="py-3">Action</th>
        </tr>
      </thead>

      <tbody class="text-sm text-slate-700">
          <tr *ngFor="let c of customers" 
          class="border-b hover:bg-slate-50 transition">

          <td class="py-4 font-semibold">
            {{ c.personResponse.fullname }}
          </td>

          <td class="py-4 wrap-break-word">
            {{ c.personResponse.email }}
          </td>

          <td class="py-4">
            {{ c.personResponse.phone }}
          </td>

          <td class="py-4">
            {{ c.personResponse.salary | number }} đ
          </td>

          <td class="py-4 wrap-break-word">
            {{ c.personResponse.location }}
          </td>
    
          <!-- Action --> 
          <td class="py-4 relative">
            <button
              (click)="toggleMenu(c, $event)"
              class="px-3 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 transition cursor-pointer">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
              </svg>
            </button>

            <div
              *ngIf="openMenu === c"
              class="absolute right-0 mt-2 w-36 bg-white border border-slate-200 rounded-xl shadow-lg py-2 z-20 dropdown-open">

              <button
                (click)="onInfCustomer(c.idCustomer)"
                class="flex items-center gap-2 w-full px-4 py-2 text-left hover:bg-slate-100 transition cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m5.231 13.481L15 17.25m-4.5-15H5.625c-.621 0-1.125.504-1.125 1.125v16.5c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Zm3.75 11.625a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
                </svg>
                <span>Detail</span>
              </button>

              <button
                (click)="deleteCustomer(c.idCustomer, $event)"
                class="flex items-center gap-2 w-full px-4 py-2 text-left hover:bg-red-200 transition cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                </svg>
                <span>Delete</span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div
    *ngIf="showAddPopup"
    class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-xl relative">
      <h2 class="text-xl font-bold mb-4">Add New Customer</h2>
      <button
        class="absolute top-3 right-5 text-3xl hover:text-red-500 text-black cursor-pointer" 
        (click)="closePopup()">
        &times;
      </button>

      <form (ngSubmit)="submitAddCustomer()" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">
            Full Name
          </label>
          <input
            type="text"
            [(ngModel)]="customerForm.fullname"
            name="fullname"
            placeholder="Enter full name"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-slate-50 
                  focus:bg-white focus:border-black focus:ring-2 focus:ring-black/40 
                  transition placeholder:text-slate-400"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">
            Email
          </label>
          <input
            type="email"
            [(ngModel)]="customerForm.email"
            name="email"
            placeholder="Enter email address"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-slate-50 
                  focus:bg-white focus:border-black focus:ring-2 focus:ring-black/40 
                  transition placeholder:text-slate-400"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">
            Phone Number
          </label>
          <input
            type="text"
            [(ngModel)]="customerForm.phone"
            name="phone"
            placeholder="Enter phone number"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-slate-50 
                  focus:bg-white focus:border-black focus:ring-2 focus:ring-black/40 
                  transition placeholder:text-slate-400"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">
            Salary
          </label>
          <input
            type="number"
            [(ngModel)]="customerForm.salary"
            name="salary"
            placeholder="Enter salary"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-slate-50 
                  focus:bg-white focus:border-black focus:ring-2 focus:ring-black/40 
                  transition placeholder:text-slate-400"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">
            Location
          </label>
          <input
            type="text"
            [(ngModel)]="customerForm.location"
            name="location"
            placeholder="Enter location"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-slate-50 
                  focus:bg-white focus:border-black focus:ring-2 focus:ring-black/40 
                  transition placeholder:text-slate-400"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-black text-white py-3 rounded-xl text-base font-medium 
                hover:bg-slate-800 transition cursor-pointer relative"
          [disabled]="isLoading">

          <div *ngIf="isLoading" class="absolute inset-0 flex items-center justify-center">
            <svg class="animate-spin h-5 w-5 text-white"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
          </div>

          <span [class.invisible]="isLoading">
            Create Customer
          </span>
        </button>
      </form>
    </div>
  </div>

  <div
    *ngIf="showUploadPopup"
    class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-xl relative">

      <h2 class="text-xl font-bold mb-4">Upload Excel Customers</h2>

      <button
        class="absolute top-3 right-5 text-3xl hover:text-red-500 cursor-pointer" 
        (click)="closeUploadPopup()">
        &times;
      </button>

      <input type="file" accept=".xlsx,.xls"
        (change)="onFileSelected($event)"
        class="border border-slate-300 w-full p-2 rounded-xl bg-slate-50"
      />

      <button
        (click)="uploadExcel()"
        class="w-full bg-green-600 text-white py-3 rounded-xl mt-4 hover:bg-green-700 cursor-pointer">
        Upload & Import Customer
      </button>
    </div>
  </div>
</div>
